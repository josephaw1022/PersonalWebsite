name: Deploy Personal Site - Development

on:
  push:
    branches:
      - main
      - master
    paths:
      - charts/personal-site/values.yaml
      - charts/personal-site/values-dev.yaml
      - charts/personal-site/templates/**
  workflow_run:
    workflows: ["Container Image - Build & Push"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Container image tag to deploy (defaults to git commit SHA)"
        required: false
        type: string

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: personal-site-runner
    environment: development
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve Image Tag
        id: resolve-tag
        uses: ./.github/actions/resolve-image-tag
        with:
          tag: ${{ inputs.tag }}
          default-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          registry-user: ${{ secrets.QUAY_USERNAME || 'admin' }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}

      - name: Deploy to Dev Environment
        uses: ./.github/actions/deploy-workload
        with:
          namespace: personal-site-dev-envs
          release-name: personal-site
          chart-path: ./charts/personal-site
          values-file: ./charts/personal-site/values-dev.yaml
          tag: ${{ steps.resolve-tag.outputs.tag }}
          registry-user: ${{ secrets.QUAY_USERNAME || 'admin' }}
