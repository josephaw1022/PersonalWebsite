name: Bootstrap Cluster Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to bootstrap (all, production, development)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - production
          - development
      tag:
        description: "Container image tag to deploy (defaults to latest)"
        required: false
        default: "latest"
        type: string
      secret_name:
        description: "Name of the pull secret to create"
        required: false
        default: "quay-pull-secret"
        type: string

jobs:
  bootstrap:
    name: Bootstrap Cluster Workloads
    runs-on: personal-site-runner
    environment: production
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Validate Target Namespaces Exist
        run: |
          TARGET_ENV="${{ inputs.target_env || 'all' }}"
          NAMESPACES=()
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "production" ]; then
            NAMESPACES+=("personal-site")
          fi
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "development" ]; then
            NAMESPACES+=("personal-site-dev-envs")
          fi

          for NS in "${NAMESPACES[@]}"; do
            echo "Checking that namespace '${NS}' exists..."
            if ! kubectl get namespace "${NS}" >/dev/null 2>&1; then
              echo "Error: Namespace '${NS}' does not exist. Please run 'infra/arc-setup.sh' to set up cluster infrastructure and runner RBAC before bootstrapping workloads." >&2
              exit 1
            fi
            echo "Namespace '${NS}' is ready."
          done

      - name: Create or Update Image Pull Secret
        run: |
          TARGET_ENV="${{ inputs.target_env || 'all' }}"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          REGISTRY_SERVER="quay.kubesoar.com"

          NAMESPACES=()
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "production" ]; then
            NAMESPACES+=("personal-site")
          fi
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "development" ]; then
            NAMESPACES+=("personal-site-dev-envs")
          fi

          for NS in "${NAMESPACES[@]}"; do
            echo "Creating or updating secret '${SECRET_NAME}' in namespace '${NS}'..."
            kubectl create secret docker-registry "${SECRET_NAME}" \
              --docker-server="${REGISTRY_SERVER}" \
              --docker-username="${{ secrets.QUAY_USERNAME }}" \
              --docker-password="${{ secrets.QUAY_PASSWORD }}" \
              --namespace="${NS}" \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "Linking '${SECRET_NAME}' to default service account in '${NS}'..."
            kubectl patch serviceaccount default -n "${NS}" -p "{\"imagePullSecrets\": [{\"name\": \"${SECRET_NAME}\"}]}" || true
          done

      - name: Deploy Production Workloads
        if: ${{ inputs.target_env == 'all' || inputs.target_env == 'production' }}
        run: |
          NAMESPACE="personal-site"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          VERSION="${{ inputs.tag || 'latest' }}"
          REGISTRY_USER="${{ secrets.QUAY_USERNAME || 'admin' }}"
          IMAGE="quay.kubesoar.com/${REGISTRY_USER}/personalwebsite"

          echo "Applying Production Deployment and Service manifests to namespace '${NAMESPACE}'..."
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: personal-site
            namespace: ${NAMESPACE}
            labels:
              app: personal-site
              version: ${VERSION}
              app.kubernetes.io/name: personal-site
              app.kubernetes.io/version: ${VERSION}
              app.kubernetes.io/part-of: personal-website-app
              app.openshift.io/runtime: nodejs
            annotations:
              app.openshift.io/connects-to: '["personal-site-runner"]'
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: personal-site
            template:
              metadata:
                labels:
                  app: personal-site
                  version: ${VERSION}
                  app.kubernetes.io/name: personal-site
                  app.kubernetes.io/version: ${VERSION}
                  app.kubernetes.io/part-of: personal-website-app
              spec:
                imagePullSecrets:
                - name: ${SECRET_NAME}
                containers:
                - name: personalwebsite
                  image: ${IMAGE}:${VERSION}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 3000
                  env:
                  - name: PORT
                    value: "3000"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: personal-site
            namespace: ${NAMESPACE}
            labels:
              app: personal-site
              app.kubernetes.io/name: personal-site
              app.kubernetes.io/part-of: personal-website-app
          spec:
            selector:
              app: personal-site
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
            type: ClusterIP
          EOF

      - name: Deploy Development Workloads
        if: ${{ inputs.target_env == 'all' || inputs.target_env == 'development' }}
        run: |
          NAMESPACE="personal-site-dev-envs"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          VERSION="${{ inputs.tag || 'latest' }}"
          REGISTRY_USER="${{ secrets.QUAY_USERNAME || 'admin' }}"
          IMAGE="quay.kubesoar.com/${REGISTRY_USER}/personalwebsite"
          DEV_DOMAIN="jwhiteaker.homelab.kubesoar.com"

          echo "Applying Dev Deployment, Service, and Ingress manifests to namespace '${NAMESPACE}'..."
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: personal-site
            namespace: ${NAMESPACE}
            labels:
              app: personal-site
              version: ${VERSION}
              app.kubernetes.io/name: personal-site
              app.kubernetes.io/version: ${VERSION}
              app.kubernetes.io/part-of: personal-website-app
              app.openshift.io/runtime: nodejs
            annotations:
              app.openshift.io/connects-to: '["personal-site-runner"]'
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: personal-site
            template:
              metadata:
                labels:
                  app: personal-site
                  version: ${VERSION}
                  app.kubernetes.io/name: personal-site
                  app.kubernetes.io/version: ${VERSION}
                  app.kubernetes.io/part-of: personal-website-app
              spec:
                imagePullSecrets:
                - name: ${SECRET_NAME}
                containers:
                - name: personalwebsite
                  image: ${IMAGE}:${VERSION}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 3000
                  env:
                  - name: PORT
                    value: "3000"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: personal-site
            namespace: ${NAMESPACE}
            labels:
              app: personal-site
              app.kubernetes.io/name: personal-site
              app.kubernetes.io/part-of: personal-website-app
          spec:
            selector:
              app: personal-site
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
            type: ClusterIP
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: personal-site-dev-ingress
            namespace: ${NAMESPACE}
            labels:
              app: personal-site
              app.kubernetes.io/name: personal-site
              app.kubernetes.io/part-of: personal-website-app
            annotations:
              kubernetes.io/ingress.class: istio
          spec:
            ingressClassName: istio
            rules:
            - host: ${DEV_DOMAIN}
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: personal-site
                      port:
                        number: 80
          EOF

      - name: Verify Rollout Status
        run: |
          TARGET_ENV="${{ inputs.target_env || 'all' }}"
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "production" ]; then
            echo "Waiting for production personal-site rollout..."
            kubectl rollout status deployment/personal-site -n personal-site --timeout=180s
          fi
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "development" ]; then
            echo "Waiting for development personal-site rollout..."
            kubectl rollout status deployment/personal-site -n personal-site-dev-envs --timeout=180s
          fi
