name: Cluster Infrastructure - Bootstrap

on:
  push:
    branches:
      - main
      - master
    paths:
      - "infra/namespaces/**"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to bootstrap (all, production, development)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - production
          - development
      tag:
        description: "Container image tag to deploy (defaults to latest)"
        required: false
        default: "latest"
        type: string
      secret_name:
        description: "Name of the pull secret to create"
        required: false
        default: "quay-pull-secret"
        type: string

jobs:
  provision-infra:
    name: Provision Infrastructure
    runs-on: personal-site-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Provision Namespaces, Resource Quotas, and Limit Ranges
        run: |
          TARGET_ENV="${{ inputs.target_env || 'all' }}"
          NAMESPACES=()
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "production" ]; then
            NAMESPACES+=("personal-site")
          fi
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "development" ]; then
            NAMESPACES+=("personal-site-dev-envs")
          fi

          for NS in "${NAMESPACES[@]}"; do
            echo "Applying namespace manifest for '${NS}'..."
            kubectl apply -f "infra/namespaces/${NS}/namespace.yaml"

            echo "Applying resource quotas and limit ranges for '${NS}'..."
            kubectl apply -R -f "infra/namespaces/${NS}/"
          done

      - name: Create or Update Image Pull Secret
        run: |
          TARGET_ENV="${{ inputs.target_env || 'all' }}"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          REGISTRY_SERVER="quay.kubesoar.com"

          NAMESPACES=()
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "production" ]; then
            NAMESPACES+=("personal-site")
          fi
          if [ "${TARGET_ENV}" = "all" ] || [ "${TARGET_ENV}" = "development" ]; then
            NAMESPACES+=("personal-site-dev-envs")
          fi

          for NS in "${NAMESPACES[@]}"; do
            echo "Creating or updating secret '${SECRET_NAME}' in namespace '${NS}'..."
            kubectl create secret docker-registry "${SECRET_NAME}" \
              --docker-server="${REGISTRY_SERVER}" \
              --docker-username="${{ secrets.QUAY_USERNAME }}" \
              --docker-password="${{ secrets.QUAY_PASSWORD }}" \
              --namespace="${NS}" \
              --dry-run=client -o yaml | kubectl apply -f -

            echo "Linking '${SECRET_NAME}' to default service account in '${NS}'..."
            kubectl patch serviceaccount default -n "${NS}" -p "{\"imagePullSecrets\": [{\"name\": \"${SECRET_NAME}\"}]}" || true
          done

  bootstrap-prod:
    name: Bootstrap Production Workload
    runs-on: personal-site-runner
    environment: production
    needs: [provision-infra]
    if: ${{ (inputs.target_env || 'all') == 'all' || inputs.target_env == 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Deploy Production Workload (Helm)
        run: |
          NAMESPACE="personal-site"
          RELEASE_NAME="personal-site"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          VERSION="${{ inputs.tag || 'latest' }}"
          REGISTRY_USER="${{ secrets.QUAY_USERNAME || 'admin' }}"
          IMAGE="quay.kubesoar.com/${REGISTRY_USER}/personalwebsite"

          if helm status "${RELEASE_NAME}" --namespace "${NAMESPACE}" 2>/dev/null | grep -iq "^STATUS:[[:space:]]*deployed"; then
            echo "Helm release '${RELEASE_NAME}' is already successfully deployed in namespace '${NAMESPACE}'. Skipping helm upgrade/install."
          else
            EXTRA_FLAGS=()
            if helm upgrade --help | grep -q -- '--force-conflicts'; then
              EXTRA_FLAGS+=(--force-conflicts)
            fi
            if helm upgrade --help | grep -q -- '--take-ownership'; then
              EXTRA_FLAGS+=(--take-ownership)
            fi

            echo "No successful Helm release found for '${RELEASE_NAME}' in namespace '${NAMESPACE}'. Deploying production Helm chart release..."
            helm upgrade --install "${RELEASE_NAME}" ./charts/personal-site \
              --namespace "${NAMESPACE}" \
              -f ./charts/personal-site/values-prod.yaml \
              --set image.repository="${IMAGE}" \
              --set image.tag="${VERSION}" \
              --set imagePullSecrets[0].name="${SECRET_NAME}" \
              --wait \
              --timeout 5m \
              "${EXTRA_FLAGS[@]}"
          fi

      - name: Verify Rollout Status
        run: |
          echo "Verifying production personal-site Helm release..."
          helm status personal-site -n personal-site

  bootstrap-dev:
    name: Bootstrap Development Workload
    runs-on: personal-site-runner
    environment: development
    needs: [provision-infra]
    if: ${{ (inputs.target_env || 'all') == 'all' || inputs.target_env == 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Deploy Development Workload (Helm)
        run: |
          NAMESPACE="personal-site-dev-envs"
          RELEASE_NAME="personal-site"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          VERSION="${{ inputs.tag || 'latest' }}"
          REGISTRY_USER="${{ secrets.QUAY_USERNAME || 'admin' }}"
          IMAGE="quay.kubesoar.com/${REGISTRY_USER}/personalwebsite"

          if helm status "${RELEASE_NAME}" --namespace "${NAMESPACE}" 2>/dev/null | grep -iq "^STATUS:[[:space:]]*deployed"; then
            echo "Helm release '${RELEASE_NAME}' is already successfully deployed in namespace '${NAMESPACE}'. Skipping helm upgrade/install."
          else
            EXTRA_FLAGS=()
            if helm upgrade --help | grep -q -- '--force-conflicts'; then
              EXTRA_FLAGS+=(--force-conflicts)
            fi
            if helm upgrade --help | grep -q -- '--take-ownership'; then
              EXTRA_FLAGS+=(--take-ownership)
            fi

            echo "No successful Helm release found for '${RELEASE_NAME}' in namespace '${NAMESPACE}'. Deploying development Helm chart release..."
            helm upgrade --install "${RELEASE_NAME}" ./charts/personal-site \
              --namespace "${NAMESPACE}" \
              -f ./charts/personal-site/values-dev.yaml \
              --set image.repository="${IMAGE}" \
              --set image.tag="${VERSION}" \
              --set imagePullSecrets[0].name="${SECRET_NAME}" \
              --wait \
              --timeout 5m \
              "${EXTRA_FLAGS[@]}"
          fi

      - name: Verify Rollout Status
        run: |
          echo "Verifying development personal-site Helm release..."
          helm status personal-site -n personal-site-dev-envs
