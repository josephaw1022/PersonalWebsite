name: Pull Request - Trivy Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "charts/**"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - "Containerfile"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "charts/**"
      - "infra/**"
      - "package.json"
      - "package-lock.json"
      - "Containerfile"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Vulnerability and Misconfiguration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
