name: Container Image - Scan Attestation

on:
  workflow_run:
    workflows: ["Container Image - Build & Push"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Container image tag to scan and attest (defaults to git commit SHA or latest)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  scan-and-attest:
    name: Scan Container Image with Grype & Attest
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Image Tag
        id: resolve-tag
        uses: ./.github/actions/resolve-image-tag
        with:
          tag: ${{ inputs.tag }}
          default-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          registry-user: ${{ secrets.QUAY_USERNAME || 'admin' }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}

      - name: Determine Image & Digest
        id: image-info
        env:
          RESOLVED_TAG: ${{ steps.resolve-tag.outputs.tag }}
          REGISTRY_SERVER: quay.kubesoar.com
          REGISTRY_USER: ${{ secrets.QUAY_USERNAME || 'admin' }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          REPO_NAME: personalwebsite
        run: |
          TAG="${RESOLVED_TAG}"
          if [ -z "${TAG}" ]; then
            TAG="latest"
          fi
          FULL_IMAGE="${REGISTRY_SERVER}/${REGISTRY_USER}/${REPO_NAME}:${TAG}"
          SUBJECT_NAME="${REGISTRY_SERVER}/${REGISTRY_USER}/${REPO_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "subject-name=${SUBJECT_NAME}" >> "$GITHUB_OUTPUT"

          echo "Resolving manifest digest for ${FULL_IMAGE}..."
          AUTH_ARGS=()
          if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
            AUTH_ARGS=(-u "${REGISTRY_USER}:${REGISTRY_PASSWORD}")
          fi

          TOKEN_RESP=$(curl -s -k "${AUTH_ARGS[@]}" "https://${REGISTRY_SERVER}/v2/auth?service=${REGISTRY_SERVER}&scope=repository:${REGISTRY_USER}/${REPO_NAME}:pull" 2>/dev/null || true)
          TOKEN=$(echo "${TOKEN_RESP}" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "${TOKEN}" ]; then
            TOKEN=$(echo "${TOKEN_RESP}" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
          fi

          HEADERS=()
          if [ -n "${TOKEN}" ]; then
            HEADERS=(-H "Authorization: Bearer ${TOKEN}")
          fi

          DIGEST=$(curl -s -k -I "${HEADERS[@]}" -H "Accept: application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" "https://${REGISTRY_SERVER}/v2/${REGISTRY_USER}/${REPO_NAME}/manifests/${TAG}" 2>/dev/null | tr -d '\r' | grep -i '^docker-content-digest:' | awk '{print $2}' || true)

          if [ -z "${DIGEST}" ] && command -v podman >/dev/null 2>&1; then
            if [ -n "${REGISTRY_PASSWORD}" ]; then
              echo "${REGISTRY_PASSWORD}" | podman login "${REGISTRY_SERVER}" -u "${REGISTRY_USER}" --password-stdin 2>/dev/null || true
            fi
            podman pull "${FULL_IMAGE}" 2>/dev/null || true
            DIGEST=$(podman inspect "${FULL_IMAGE}" --format '{{.Digest}}' 2>/dev/null || true)
          fi

          if [ -n "${DIGEST}" ] && [[ "${DIGEST}" != sha256:* ]]; then
            DIGEST="sha256:${DIGEST}"
          fi

          echo "Resolved digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay Registry
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.kubesoar.com -u "${{ secrets.QUAY_USERNAME || 'admin' }}" --password-stdin

      - name: Scan Image with Grype (SARIF)
        id: grype-sarif
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image-info.outputs.image }}
          fail-build: false
          severity-cutoff: low
          output-format: sarif

      - name: Scan Image with Grype (JSON)
        id: grype-json
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image-info.outputs.image }}
          fail-build: false
          severity-cutoff: low
          output-format: json

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: "container-image-grype-scan"

      - name: Attest Security Scan Results
        if: steps.image-info.outputs.digest != ''
        uses: actions/attest@v2
        with:
          subject-name: ${{ steps.image-info.outputs.subject-name }}
          subject-digest: ${{ steps.image-info.outputs.digest }}
          predicate-type: "https://in-toto.io/attestation/vuln/v0.1"
          predicate-path: ${{ steps.grype-json.outputs.json }}
          push-to-registry: false

      - name: Upload Scan Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-grype-scan-${{ steps.image-info.outputs.tag }}
          path: |
            ${{ steps.grype-json.outputs.json }}
            ${{ steps.grype-sarif.outputs.sarif }}
