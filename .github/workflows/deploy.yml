name: Deploy Personal Site

on:
  workflow_run:
    workflows: ["Container Build & Push"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Container image tag to deploy (defaults to git commit SHA)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: personal-site-runner
    environment: production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Update deployment and reroll
        run: |
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="${SHA:0:7}"
          else
            SHA="${{ github.sha }}"
            TAG="${SHA:0:7}"
          fi

          REGISTRY_USER="${{ secrets.QUAY_USERNAME || 'admin' }}"
          IMAGE="quay.kubesoar.com/${REGISTRY_USER}/personalwebsite"

          echo "Updating deployment image to ${IMAGE}:$TAG..."
          kubectl set image deployment/personal-site personalwebsite=${IMAGE}:$TAG -n personal-site

          echo "Updating version label to $TAG..."
          kubectl patch deployment personal-site -n personal-site --type='strategic' -p "{\"metadata\":{\"labels\":{\"version\":\"$TAG\",\"app.kubernetes.io/version\":\"$TAG\"}},\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"version\":\"$TAG\",\"app.kubernetes.io/version\":\"$TAG\"}}}}}"

          echo "Triggering rollout restart for personal-site deployment..."
          kubectl rollout restart deployment/personal-site -n personal-site

          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment/personal-site -n personal-site
