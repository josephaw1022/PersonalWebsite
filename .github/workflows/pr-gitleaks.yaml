name: Pull Request - GitLeaks Scan

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "__tests__/**"
      - "infra/**"
      - "charts/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "Containerfile"
      - "*.{js,jsx,ts,tsx,mjs,cjs,json,yaml,yml,sh}"
      - ".github/workflows/pr-gitleaks.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "__tests__/**"
      - "infra/**"
      - "charts/**"
      - ".github/**"
      - "package.json"
      - "package-lock.json"
      - "Containerfile"
      - "*.{js,jsx,ts,tsx,mjs,cjs,json,yaml,yml,sh}"
      - ".github/workflows/pr-gitleaks.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
