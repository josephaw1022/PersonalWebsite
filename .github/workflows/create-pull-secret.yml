name: Create Quay Pull Secret

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: "personal-site"
        type: string
      secret_name:
        description: "Name of the pull secret to create"
        required: false
        default: "quay-pull-secret"
        type: string

jobs:
  create-pull-secret:
    name: Create Quay Image Pull Secret
    runs-on: personal-site-runner
    environment: production
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Create or Update Pull Secret
        run: |
          NAMESPACE="${{ inputs.namespace || 'personal-site' }}"
          SECRET_NAME="${{ inputs.secret_name || 'quay-pull-secret' }}"
          REGISTRY_SERVER="quay.kubesoar.com"

          echo "Creating or updating secret '${SECRET_NAME}' in namespace '${NAMESPACE}'..."
          kubectl create secret docker-registry "${SECRET_NAME}" \
            --docker-server="${REGISTRY_SERVER}" \
            --docker-username="${{ secrets.QUAY_USERNAME }}" \
            --docker-password="${{ secrets.QUAY_PASSWORD }}" \
            --namespace="${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Linking '${SECRET_NAME}' to default service account in '${NAMESPACE}'..."
          kubectl patch serviceaccount default -n "${NAMESPACE}" -p "{\"imagePullSecrets\": [{\"name\": \"${SECRET_NAME}\"}]}" || true

          echo "Image pull secret '${SECRET_NAME}' configured successfully."
