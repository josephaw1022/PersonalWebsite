name: Pull Request - Unit Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "__tests__/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "jest.config.ts"
      - "jest.setup.ts"
      - "tsconfig.json"
      - "next.config.ts"
      - ".github/workflows/pr-unit-tests.yaml"
  workflow_dispatch:

jobs:
  test:
    name: Run Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
