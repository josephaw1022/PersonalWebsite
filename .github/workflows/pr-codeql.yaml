name: Pull Request - CodeQL Scan

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "__tests__/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "jest.config.ts"
      - "jest.setup.ts"
      - "playwright.config.ts"
      - ".github/workflows/pr-codeql.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "__tests__/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "jest.config.ts"
      - "jest.setup.ts"
      - "playwright.config.ts"
      - ".github/workflows/pr-codeql.yaml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
