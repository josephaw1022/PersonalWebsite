name: Deploy Personal Site - AWS (Terraform)

on:
  push:
    branches: [main, master]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to execute"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - plan
          - destroy
      image_tag:
        description: "GHCR container image tag to deploy (leave blank to use Terraform default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-personal-site
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID }}
  TF_VAR_aws_partition: ${{ vars.AWS_PARTITION || secrets.AWS_PARTITION || 'aws' }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID || vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
  TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}
  TF_VAR_datadog_site: ${{ vars.DATADOG_SITE || 'us5.datadoghq.com' }}

jobs:
  terraform:
    name: Terraform (${{ inputs.action || 'apply' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Validate
        run: terraform validate

      - name: Set Image Tag Override
        if: ${{ inputs.image_tag != '' }}
        run: echo "TF_VAR_ghcr_image_tag=${{ inputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Set Alert Configuration Overrides
        run: |
          if [[ -n "${{ vars.ALERT_EMAIL || secrets.ALERT_EMAIL }}" ]]; then
            echo "TF_VAR_alert_email=${{ vars.ALERT_EMAIL || secrets.ALERT_EMAIL }}" >> "$GITHUB_ENV"
          fi

      - name: Terraform Plan
        if: ${{ github.event.inputs.action != 'destroy' }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve
