name: Container Image - Build & Push
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "Containerfile"
      - ".github/workflows/build-and-push.yaml"
      - ".github/actions/container-scan-attestation/**"
      - ".github/actions/container-sbom-attestation/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    name: Build & Push Container Image
    runs-on: personal-site-runner
    outputs:
      image: ${{ steps.build-push.outputs.image }}
      tag: ${{ steps.build-push.outputs.tag }}
      subject-name: ${{ steps.build-push.outputs.subject-name }}
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Podman
        run: |
          if ! command -v podman &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          sudo sed -i '/runner/d' /etc/subuid /etc/subgid 2>/dev/null || true
          mkdir -p ~/.config/containers
          cat <<'EOF' > ~/.config/containers/storage.conf
          [storage]
          driver = "vfs"

          [storage.options.vfs]
          ignore_chown_errors = "true"
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Log in to Quay Registry
        run: echo "${{ secrets.QUAY_PASSWORD }}" | podman login quay.kubesoar.com -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build and Push Image
        id: build-push
        run: |
          IMAGE="quay.kubesoar.com/${{ secrets.QUAY_USERNAME }}/personalwebsite"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          podman build -f Containerfile \
            -t "${IMAGE}:${SHORT_SHA}" \
            -t "${IMAGE}:${SHA}" .
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            podman tag "${IMAGE}:${SHORT_SHA}" "${IMAGE}:latest"
          fi

          podman push --digestfile digest.txt "${IMAGE}:${SHORT_SHA}"
          DIGEST=$(cat digest.txt 2>/dev/null || true)
          if [ -n "${DIGEST}" ] && [[ "${DIGEST}" != sha256:* ]]; then
            DIGEST="sha256:${DIGEST}"
          fi

          podman push "${IMAGE}:${SHA}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            podman push "${IMAGE}:latest"
          fi

          echo "image=${IMAGE}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "subject-name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan & Attest Container Image
    needs: build
    runs-on: personal-site-runner
    steps:
      - uses: actions/checkout@v7

      - name: Scan Container Image with Grype & Attest
        uses: ./.github/actions/container-scan-attestation
        with:
          image: ${{ needs.build.outputs.image }}
          tag: ${{ needs.build.outputs.tag }}
          subject-name: ${{ needs.build.outputs.subject-name }}
          digest: ${{ needs.build.outputs.digest }}
          registry-user: ${{ secrets.QUAY_USERNAME }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}

  sbom:
    name: Generate & Attest SBOM
    needs: build
    runs-on: personal-site-runner
    steps:
      - uses: actions/checkout@v7

      - name: Generate & Attest SBOM
        uses: ./.github/actions/container-sbom-attestation
        with:
          image: ${{ needs.build.outputs.image }}
          tag: ${{ needs.build.outputs.tag }}
          subject-name: ${{ needs.build.outputs.subject-name }}
          digest: ${{ needs.build.outputs.digest }}
          registry-user: ${{ secrets.QUAY_USERNAME }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}
