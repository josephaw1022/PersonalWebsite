name: Container Build & Push
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: personal-site-runner
    steps:
      - uses: actions/checkout@v7

      - name: Setup Podman
        run: |
          if ! command -v podman &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          sudo sed -i '/runner/d' /etc/subuid /etc/subgid 2>/dev/null || true
          mkdir -p ~/.config/containers
          cat <<'EOF' > ~/.config/containers/storage.conf
          [storage]
          driver = "vfs"

          [storage.options.vfs]
          ignore_chown_errors = "true"
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Log in to Quay Registry
        run: echo "${{ secrets.QUAY_PASSWORD }}" | podman login quay.kubesoar.com -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          IMAGE="quay.kubesoar.com/${{ secrets.QUAY_USERNAME }}/personalwebsite"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          podman build -f Containerfile \
            -t "${IMAGE}:${SHORT_SHA}" \
            -t "${IMAGE}:${SHA}" .
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            podman tag "${IMAGE}:${SHORT_SHA}" "${IMAGE}:latest"
          fi

      - name: Push image
        run: |
          IMAGE="quay.kubesoar.com/${{ secrets.QUAY_USERNAME }}/personalwebsite"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          podman push "${IMAGE}:${SHORT_SHA}"
          podman push "${IMAGE}:${SHA}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            podman push "${IMAGE}:latest"
          fi
