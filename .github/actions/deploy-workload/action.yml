name: Deploy Workload
description: Deploy container image to Kubernetes cluster using Helm and monitor rollout status

inputs:
  namespace:
    description: Target Kubernetes namespace
    required: true
  release-name:
    description: Name of Helm release
    required: false
    default: personal-site
  chart-path:
    description: Path to Helm chart
    required: false
    default: ./charts/personal-site
  values-file:
    description: Path to environment-specific values file
    required: false
    default: ""
  tag:
    description: Image tag to deploy
    required: true
  registry-user:
    description: Container registry username
    required: false
    default: admin
  registry-server:
    description: Container registry server
    required: false
    default: quay.kubesoar.com
  pull-secret:
    description: Name of image pull secret
    required: false
    default: quay-pull-secret
  timeout:
    description: Timeout for Helm upgrade/install
    required: false
    default: 5m

runs:
  using: composite
  steps:
    - name: Setup kubectl
      uses: azure/setup-kubectl@v5
      with:
        version: latest

    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: latest

    - name: Deploy Helm Chart and wait for rollout
      shell: bash
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        RELEASE_NAME="${{ inputs.release-name }}"
        CHART_PATH="${{ inputs.chart-path }}"
        VALUES_FILE="${{ inputs.values-file }}"
        TAG="${{ inputs.tag }}"
        REGISTRY_USER="${{ inputs.registry-user }}"
        REGISTRY_SERVER="${{ inputs.registry-server }}"
        PULL_SECRET="${{ inputs.pull-secret }}"
        TIMEOUT="${{ inputs.timeout }}"

        IMAGE_REPO="${REGISTRY_SERVER}/${REGISTRY_USER}/personalwebsite"

        HELM_ARGS=(
          --namespace "${NAMESPACE}"
          --install
          --wait
          --timeout "${TIMEOUT}"
          --set "image.repository=${IMAGE_REPO}"
          --set "image.tag=${TAG}"
          --set "imagePullSecrets[0].name=${PULL_SECRET}"
        )

        if [ -n "${VALUES_FILE}" ] && [ -f "${VALUES_FILE}" ]; then
          echo "Using environment values file: ${VALUES_FILE}"
          HELM_ARGS+=(-f "${VALUES_FILE}")
        fi

        echo "Deploying Helm release '${RELEASE_NAME}' to namespace '${NAMESPACE}' with image '${IMAGE_REPO}:${TAG}'..."
        helm upgrade "${RELEASE_NAME}" "${CHART_PATH}" "${HELM_ARGS[@]}"

        echo "Helm release '${RELEASE_NAME}' successfully deployed to namespace '${NAMESPACE}'."
