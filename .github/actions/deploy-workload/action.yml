name: Deploy Workload
description: Deploy container image to Kubernetes deployment and monitor rollout status

inputs:
  namespace:
    description: Target Kubernetes namespace
    required: true
  deployment-name:
    description: Name of deployment to update
    required: false
    default: personal-site
  tag:
    description: Image tag to deploy
    required: true
  registry-user:
    description: Container registry username
    required: false
    default: admin
  registry-server:
    description: Container registry server
    required: false
    default: quay.kubesoar.com
  pull-secret:
    description: Name of image pull secret
    required: false
    default: quay-pull-secret

runs:
  using: composite
  steps:
    - name: Setup kubectl
      uses: azure/setup-kubectl@v5
      with:
        version: latest

    - name: Update deployment image and wait for rollout
      shell: bash
      run: |
        NAMESPACE="${{ inputs.namespace }}"
        DEPLOYMENT="${{ inputs.deployment-name }}"
        TAG="${{ inputs.tag }}"
        REGISTRY_USER="${{ inputs.registry-user }}"
        REGISTRY_SERVER="${{ inputs.registry-server }}"
        IMAGE="${REGISTRY_SERVER}/${REGISTRY_USER}/personalwebsite"
        PULL_SECRET="${{ inputs.pull-secret }}"

        echo "Updating deployment ${DEPLOYMENT} image to ${IMAGE}:${TAG} in namespace ${NAMESPACE}..."
        kubectl set image "deployment/${DEPLOYMENT}" "personalwebsite=${IMAGE}:${TAG}" -n "${NAMESPACE}"

        echo "Checking if image pull secret '${PULL_SECRET}' is configured on deployment..."
        if ! kubectl get deployment "${DEPLOYMENT}" -n "${NAMESPACE}" -o jsonpath='{.spec.template.spec.imagePullSecrets[*].name}' 2>/dev/null | grep -qw "${PULL_SECRET}"; then
          echo "Adding image pull secret '${PULL_SECRET}' to deployment..."
          kubectl patch deployment "${DEPLOYMENT}" -n "${NAMESPACE}" --type='strategic' -p "{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"${PULL_SECRET}\"}]}}}}"
        else
          echo "Image pull secret '${PULL_SECRET}' is already configured on deployment."
        fi

        echo "Updating version label to ${TAG}..."
        kubectl patch deployment "${DEPLOYMENT}" -n "${NAMESPACE}" --type='strategic' -p "{\"metadata\":{\"labels\":{\"version\":\"${TAG}\",\"app.kubernetes.io/version\":\"${TAG}\"}},\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"version\":\"${TAG}\",\"app.kubernetes.io/version\":\"${TAG}\"}}}}}"

        echo "Triggering rollout restart for ${DEPLOYMENT} deployment..."
        kubectl rollout restart "deployment/${DEPLOYMENT}" -n "${NAMESPACE}"

        echo "Waiting for rollout to complete..."
        kubectl rollout status "deployment/${DEPLOYMENT}" -n "${NAMESPACE}"
