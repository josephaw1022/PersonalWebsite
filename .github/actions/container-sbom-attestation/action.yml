name: Container SBOM & Attestation
description: Generate SPDX SBOM with Syft, attest SBOM attestation, and upload artifact

inputs:
  image:
    description: Full container image reference including tag (e.g. quay.kubesoar.com/admin/personalwebsite:sha)
    required: true
  tag:
    description: Container image tag
    required: false
    default: ""
  subject-name:
    description: Attestation subject name (e.g. quay.kubesoar.com/admin/personalwebsite)
    required: false
    default: ""
  digest:
    description: Image digest (sha256:...) for attestation
    required: false
    default: ""
  registry-server:
    description: Container registry server host
    required: false
    default: quay.kubesoar.com
  registry-user:
    description: Container registry username / namespace
    required: false
    default: ""
  registry-password:
    description: Container registry password or token for authentication
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Log in to Registry
      if: inputs.registry-password != ''
      shell: bash
      run: |
        if command -v docker >/dev/null 2>&1; then
          echo "${{ inputs.registry-password }}" | docker login "${{ inputs.registry-server }}" -u "${{ inputs.registry-user }}" --password-stdin 2>/dev/null || true
        fi
        if command -v podman >/dev/null 2>&1; then
          echo "${{ inputs.registry-password }}" | podman login "${{ inputs.registry-server }}" -u "${{ inputs.registry-user }}" --password-stdin 2>/dev/null || true
        fi

    - name: Generate SBOM with Syft
      uses: anchore/sbom-action@v0
      with:
        image: ${{ inputs.image }}
        format: "spdx-json"
        output-file: "sbom.spdx.json"

    - name: Attest SBOM
      if: inputs.digest != ''
      uses: actions/attest-sbom@v2
      with:
        sbom-path: "sbom.spdx.json"
        subject-name: ${{ inputs.subject-name != '' && inputs.subject-name || inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: false

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-spdx-${{ inputs.tag != '' && inputs.tag || 'artifact' }}
        path: sbom.spdx.json
