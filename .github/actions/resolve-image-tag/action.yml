name: Resolve Image Tag
description: Resolve container image tag or verify candidate commit tag against container registry with fallback

inputs:
  tag:
    description: Explicitly supplied container image tag (bypasses fallback if non-empty)
    required: false
    default: ""
  default-sha:
    description: Git commit SHA to derive candidate image tag from if no explicit tag is supplied
    required: false
    default: ""
  registry-server:
    description: Container registry server host
    required: false
    default: quay.kubesoar.com
  registry-user:
    description: Container registry username / namespace
    required: false
    default: admin
  registry-password:
    description: Container registry password or token for authentication
    required: false
    default: ""
  repository-name:
    description: Repository name on the container registry
    required: false
    default: personalwebsite

outputs:
  tag:
    description: Resolved container image tag (or empty string if tag does not exist in registry)
    value: ${{ steps.resolve.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Resolve and verify image tag
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SHA: ${{ inputs.default-sha }}
        REGISTRY_SERVER: ${{ inputs.registry-server }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        REPO_NAME: ${{ inputs.repository-name }}
      run: |
        if [ -n "${INPUT_TAG}" ]; then
          echo "Using explicitly provided image tag: ${INPUT_TAG}"
          echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        SHA="${INPUT_SHA:-${{ github.sha }}}"
        CANDIDATE_TAG="${SHA:0:7}"
        echo "No explicit tag provided. Candidate tag based on commit SHA: ${CANDIDATE_TAG}"

        IMAGE_EXISTS=false

        # 1. Check candidate tag via OCI v2 manifest API
        echo "Checking registry for tag '${CANDIDATE_TAG}' via OCI v2 API..."
        AUTH_ARGS=()
        if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
          AUTH_ARGS=(-u "${REGISTRY_USER}:${REGISTRY_PASSWORD}")
        fi

        TOKEN_RESP=$(curl -s -k "${AUTH_ARGS[@]}" "https://${REGISTRY_SERVER}/v2/auth?service=${REGISTRY_SERVER}&scope=repository:${REGISTRY_USER}/${REPO_NAME}:pull" 2>/dev/null || true)
        TOKEN=$(echo "${TOKEN_RESP}" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
        if [ -z "${TOKEN}" ]; then
          TOKEN=$(echo "${TOKEN_RESP}" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
        fi

        HEADERS=()
        if [ -n "${TOKEN}" ]; then
          HEADERS=(-H "Authorization: Bearer ${TOKEN}")
        fi

        HTTP_CODE=$(curl -s -k -o /dev/null -w "%{http_code}" "${HEADERS[@]}" "https://${REGISTRY_SERVER}/v2/${REGISTRY_USER}/${REPO_NAME}/manifests/${CANDIDATE_TAG}" 2>/dev/null || true)
        if [ "${HTTP_CODE}" = "200" ]; then
          echo "Candidate tag '${CANDIDATE_TAG}' verified in registry via OCI API."
          IMAGE_EXISTS=true
        fi

        # 2. Check candidate tag via container runtime pull if available and not yet verified
        if [ "${IMAGE_EXISTS}" = "false" ]; then
          FULL_IMAGE="${REGISTRY_SERVER}/${REGISTRY_USER}/${REPO_NAME}:${CANDIDATE_TAG}"
          if [ -n "${REGISTRY_PASSWORD}" ] && [ -n "${REGISTRY_USER}" ]; then
            if command -v podman >/dev/null 2>&1; then
              echo "${REGISTRY_PASSWORD}" | podman login "${REGISTRY_SERVER}" -u "${REGISTRY_USER}" --password-stdin 2>/dev/null || true
            fi
          fi

          if command -v podman >/dev/null 2>&1; then
            echo "Attempting to pull '${FULL_IMAGE}' via podman..."
            if podman pull "${FULL_IMAGE}" 2>/dev/null; then
              echo "Successfully pulled '${FULL_IMAGE}' via podman."
              IMAGE_EXISTS=true
            fi
          fi
        fi

        if [ "${IMAGE_EXISTS}" = "true" ]; then
          echo "Image tag '${CANDIDATE_TAG}' verified. Setting image tag for deployment."
          echo "tag=${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "Candidate tag '${CANDIDATE_TAG}' is not available in registry. Omitting image tag override so existing release values are reused."
          echo "tag=" >> "$GITHUB_OUTPUT"
        fi
