version: "3"

vars:
  IMAGE_NAME: personal-site
  CONTAINER_NAME: personal-site-dev
  PORT: "3000"

includes:
  tf:
    taskfile: ./terraform/Taskfile.yaml
    dir: ./terraform

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  dev:
    desc: Run Next.js local development server
    cmds:
      - npm run dev

  build:
    desc: Build Next.js production bundle
    cmds:
      - npm run build

  test:
    desc: Run Jest unit tests
    cmds:
      - npm run test

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - npm run test:e2e

  playwright:install:
    desc: Install Playwright browser binaries
    cmds:
      - npx playwright install chromium

  test:all:
    desc: Run all unit and E2E tests
    cmds:
      - npm run test
      - npm run test:e2e

  screenshots:
    desc: Capture UI screenshots across light and dark modes for visual inspection
    cmds:
      - npm run screenshots

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  lint:fix:
    desc: Run ESLint with automatic fixes
    cmds:
      - npx eslint --fix

  format:
    desc: Format codebase with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check formatting with Prettier
    cmds:
      - npm run format:check

  format:all:
    desc: Format both codebase with Prettier and Terraform configurations
    cmds:
      - npm run format
      - task: tf:fmt

  test:helm:
    desc: Run Helm unit tests using helm-unittest
    cmds:
      - helm unittest charts/personal-site

  helm:lint:
    desc: Lint Helm chart
    cmds:
      - helm lint charts/personal-site

  helm:test:
    desc: Run Helm unit tests using helm-unittest
    cmds:
      - helm unittest charts/personal-site

  pr:check:
    aliases: [pr-check]
    desc: Run essential pre-PR checks (format check, lint, unit tests, Next.js build, and Terraform validate)
    cmds:
      - npm run format:check
      - npm run lint
      - npm run test
      - npm run build
      - task: tf:init
      - task: tf:check

  check:
    desc: Run all quality checks (formatting check, lint, unit tests, Helm unit tests, Terraform validation, and E2E tests)
    cmds:
      - npm run format:check
      - npm run lint
      - npm run test
      - helm lint charts/personal-site
      - helm unittest charts/personal-site
      - task: tf:check
      - npm run test:e2e

  clean:
    desc: Clean build artifacts and temporary test output
    cmds:
      - rm -rf .next coverage test-results playwright-report

  build-container:
    desc: Build the Next.js production container image using Podman
    cmds:
      - npm run build
      - podman build -t "{{.IMAGE_NAME}}" -f Containerfile .

  run-container:
    desc: Run the built production container using Podman
    deps: [build-container]
    cmds:
      - |
        podman run --replace -d --name "{{.CONTAINER_NAME}}" -p "{{.PORT}}:3000" "{{.IMAGE_NAME}}"

  stop:
    desc: Stop and remove the dev container if it exists (Podman)
    silent: true
    cmds:
      - podman rm -f "{{.CONTAINER_NAME}}" >/dev/null 2>&1 || true
