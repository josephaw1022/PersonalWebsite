version: "3"

vars:
  IMAGE_NAME: personal-site
  CONTAINER_NAME: personal-site-dev
  PORT: "3000"

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  dev:
    desc: Run Next.js local development server
    cmds:
      - npm run dev

  test:
    desc: Run Jest unit tests
    cmds:
      - npm run test

  test:e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - npm run test:e2e

  test:all:
    desc: Run all unit and E2E tests
    cmds:
      - npm run test
      - npm run test:e2e

  screenshots:
    desc: Capture UI screenshots across light and dark modes for visual inspection
    cmds:
      - npm run screenshots

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  format:
    desc: Format codebase with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check formatting with Prettier
    cmds:
      - npm run format:check

  check:
    desc: Run all quality checks (formatting check, lint, unit tests, and E2E tests)
    cmds:
      - npm run format:check
      - npm run lint
      - npm run test
      - npm run test:e2e

  build-container:
    desc: Build the Next.js production container image using Podman
    cmds:
      - npm run build
      - podman build -t "{{.IMAGE_NAME}}" -f Containerfile .

  run-container:
    desc: Run the built production container using Podman
    deps: [build-container]
    cmds:
      - |
        podman run --replace -d --name "{{.CONTAINER_NAME}}" -p "{{.PORT}}:3000" "{{.IMAGE_NAME}}"

  stop:
    desc: Stop and remove the dev container if it exists (Podman)
    silent: true
    cmds:
      - podman rm -f "{{.CONTAINER_NAME}}" >/dev/null 2>&1 || true
