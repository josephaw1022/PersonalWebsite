suite: test ingress template
templates:
  - ingress.yaml
tests:
  - it: should not render Ingress by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render Ingress when enabled
    set:
      ingress:
        enabled: true
        className: "istio"
        name: "personal-site-dev-ingress"
        annotations:
          kubernetes.io/ingress.class: istio
          cert-manager.io/cluster-issuer: cloudflare-dns01
        hosts:
          - host: jwhiteaker.homelab.kubesoar.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: personal-site-dev-tls
            hosts:
              - jwhiteaker.homelab.kubesoar.com
    asserts:
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: personal-site-dev-ingress
      - equal:
          path: spec.ingressClassName
          value: istio
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: cloudflare-dns01
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: istio
      - equal:
          path: spec.rules[0].host
          value: jwhiteaker.homelab.kubesoar.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: personal-site
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
      - equal:
          path: spec.tls[0].secretName
          value: personal-site-dev-tls
      - equal:
          path: spec.tls[0].hosts[0]
          value: jwhiteaker.homelab.kubesoar.com
