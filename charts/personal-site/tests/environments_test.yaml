suite: test environment values
templates:
  - deployment.yaml
  - ingress.yaml
  - pdb.yaml
  - service.yaml
  - hpa.yaml
  - networkpolicy.yaml
tests:
  - it: should correctly configure development environment
    values:
      - ../values-dev.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: "/"
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/"
        template: deployment.yaml
      - isNull:
          path: spec.replicas
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels.app
          value: personal-site
        template: deployment.yaml
      - isKind:
          of: Ingress
        template: ingress.yaml
      - equal:
          path: spec.rules[0].host
          value: jwhiteaker.homelab.kubesoar.com
        template: ingress.yaml
      - isKind:
          of: PodDisruptionBudget
        template: pdb.yaml
      - equal:
          path: spec.minAvailable
          value: 1
        template: pdb.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 3
        template: hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 5
        template: hpa.yaml
      - hasDocuments:
          count: 3
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-default-deny
        documentIndex: 0
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-allow-ingress
        documentIndex: 1
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 2
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-allow-dns
        documentIndex: 2
        template: networkpolicy.yaml

  - it: should correctly configure production environment
    values:
      - ../values-prod.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: "/"
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/"
        template: deployment.yaml
      - isNull:
          path: spec.replicas
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
        template: deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels.app
          value: personal-site
        template: deployment.yaml
      - hasDocuments:
          count: 0
        template: ingress.yaml
      - isKind:
          of: PodDisruptionBudget
        template: pdb.yaml
      - equal:
          path: spec.minAvailable
          value: 2
        template: pdb.yaml
      - isKind:
          of: HorizontalPodAutoscaler
        template: hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 3
        template: hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 10
        template: hpa.yaml
      - hasDocuments:
          count: 3
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-default-deny
        documentIndex: 0
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 1
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-allow-cloudflared
        documentIndex: 1
        template: networkpolicy.yaml
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: cloudflared
        documentIndex: 1
        template: networkpolicy.yaml
      - isKind:
          of: NetworkPolicy
        documentIndex: 2
        template: networkpolicy.yaml
      - equal:
          path: metadata.name
          value: personal-site-allow-dns
        documentIndex: 2
        template: networkpolicy.yaml
