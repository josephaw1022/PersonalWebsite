# Default values for personal-site chart.
# This is a YAML-formatted file.

replicaCount: 3

image:
  repository: quay.kubesoar.com/admin/personalwebsite
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: quay-pull-secret

nameOverride: ""
fullnameOverride: "personal-site"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}

podSecurityContext: {}
securityContext: {}

port: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "istio"
  name: ""
  annotations:
    kubernetes.io/ingress.class: istio
    cert-manager.io/cluster-issuer: cloudflare-dns01
  hosts:
    - host: jwhiteaker.homelab.kubesoar.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: personal-site-dev-tls
      hosts:
        - jwhiteaker.homelab.kubesoar.com

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1
  annotations: {}

openshift:
  partOf: personal-website-app
  runtime: nodejs
  connectsTo: '["personal-site-runner"]'

resources: {}

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
